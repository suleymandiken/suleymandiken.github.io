<html lang="tr"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#faf6f1;--card:#fff;--tx:#241a16;--mu:#857a72;--bd:#ece3da;--ac:#ee6c4d;--on:#fff;--neg:#d64545;--pos:#15935a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0d;--card:#221a17;--tx:#f6ede4;--mu:#a99c92;--bd:#332826;--ac:#f0805f;--on:#2a130c;--neg:#ff8a80;--pos:#5fd39a}}
:root[data-theme="dark"]{--bg:#150f0d;--card:#221a17;--tx:#f6ede4;--mu:#a99c92;--bd:#332826;--ac:#f0805f;--on:#2a130c;--neg:#ff8a80;--pos:#5fd39a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 4px;font-weight:800}h2{font-size:18px;margin:20px 0 10px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--neg)}.pos{color:var(--pos)}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;color:var(--ac);line-height:1.1}.b2{font-size:22px;font-weight:800;letter-spacing:-.02em}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;width:100%}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;cursor:pointer;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button.p{background:var(--ac);color:var(--on);border:0}button.w{width:100%;margin-top:10px}button.g{background:none;border:0;color:var(--mu);padding:6px}
label.fl{display:block;text-align:center;border:1px dashed var(--ac);color:var(--ac);border-radius:14px;padding:11px;margin-top:10px;cursor:pointer;font-weight:600}
.lb{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip.on,.seg .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.seg{display:flex;gap:8px}.seg button{flex:1}
.pbar,.bar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac)}
.ec{background:color-mix(in srgb,hsl(var(--h) 60% 50%) 18%,var(--card));border-radius:20px;padding:14px}
.ec .emo{font-size:26px}.ec .b2{margin:2px 0}.bar{margin-top:8px;background:color-mix(in srgb,var(--tx) 12%,transparent)}.bar i{display:block;height:100%;background:hsl(var(--h) 55% 58%)}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.tx img{width:42px;height:42px;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--bd)}.ti{font-size:24px;width:42px;text-align:center;flex:none}
.tx .m{flex:1;min-width:0}.tx .m b,.tx .m>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ban{background:color-mix(in srgb,var(--ac) 16%,var(--card));border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pill{display:inline-block;font-size:12px;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.li{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.li .ic{font-size:20px;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:14px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu);gap:4px;min-width:0}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--ac);min-height:3px}.bars i.pr{background:color-mix(in srgb,var(--ac) 25%,transparent);border:1.5px dashed var(--ac)}
nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:544px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:6px;z-index:4}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);padding:6px 0;gap:2px}nav button.on{color:var(--ac)}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--on);font-size:24px;margin:-26px auto 0;padding:0;justify-content:center;box-shadow:0 6px 18px #0004}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:#0007;z-index:5}.sh{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;max-width:560px;margin:0 auto}
#pv{max-width:100%;max-height:150px;border-radius:12px;margin-top:8px;display:block}
#big{position:fixed;inset:0;background:#000d;z-index:9;display:flex;align-items:center;justify-content:center}#big img{max-width:96%;max-height:92%}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:20;text-align:center;font-weight:600}
#mic.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
</style></head><body>
<div id="app"></div>
<nav id="nav" class="hide">
<button data-a="nav" data-v="home">🏠<span>Ana sayfa</span></button>
<button data-a="nav" data-v="env">✉️<span>Zarflar</span></button>
<button class="fab" data-a="sheet" aria-label="Harcama ekle">＋</button>
<button data-a="nav" data-v="an">📊<span>Analiz</span></button>
<button data-a="nav" data-v="menu">☰<span>Menü</span></button></nav>
<div id="sheet"></div><div id="toast" class="hide"></div><div id="big" class="hide" data-a="unzoom"><img alt=""></div>
<script>
// ---------- sabitler ve yardımcılar ----------
const M=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"],H=[140,25,270,350,45,200,320,90,170,10,230,60];
const DEF=[["Kira","🏠",35,1],["Market","🛒",14,1],["Yemek","🍔",8,1],["Ulaşım","🚌",6,1],["Faturalar","💡",8,1],["Kahve","☕",2,0],["Abonelikler","🎬",2,0],["Kişisel bakım","💄",3,0],["Spor salonu","🏋️",2,0],["Eğlence","🎉",5,1],["Tatil fonu","✈️",5,0],["Acil durum fonu","💰",5,0]];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tl=n=>(n<0?"−":"")+"₺"+Math.abs(Math.round(n||0)).toLocaleString("tr-TR");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mk=(y,m)=>{const d=new Date(y,m,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const clone=o=>JSON.parse(JSON.stringify(o));
const envOf=id=>S&&id?S.env.find(e=>e.id==id):null;
const dday=s=>{const d=new Date(s+"T12:00:00");return d.getDate()+" "+M[d.getMonth()]};
const DEBTRULE="\nBU İSTEK BORÇ AKTARIMI: Girdi Findeks kredi raporu ya da banka uygulaması ekran görüntüleridir. Yalnızca k=borc kayıtları üret; gider, gelir ya da bordro üretme. Her kredi kartı için tip=kart: bal=güncel/dönem borcu (limit değil), asgari=asgari ödeme, gun=son ödeme günü (ayın günü), limit=kart limiti. Her ihtiyaç, taşıt, konut kredisi ve taksitli ürün için tip=taksit: aylik=aylık taksit tutarı, kalan_ay=kalan taksit sayısı, gun=taksit günü. ad alanına banka ve ürün adını yaz (örn: Garanti Bonus Kart, Akbank İhtiyaç Kredisi); mevcut borçlardan biriyle aynı ürünse aynı adı kullan. Kapanmış ya da borcu sıfır olan ürünleri atla. Görünmeyen alanı 0 bırak, tahmin etme. Mesajda toplam borcu ve varsa gecikmedeki ürünü belirt.";
let CH=DEF.map(d=>({n:d[0],e:d[1],w:d[2],on:!!d[3]}));
const chipsHTML=()=>CH.map((d,i)=>`<button class="chip ${d.on?"on":""}" data-a="chip" data-v="${i}">${esc(d.e)} ${esc(d.n)}</button>`).join("");

// ---------- durum ----------
let S=null,view="home",SH=null,dtype="kart",RTY="gider",sample=null,canAI=false,imgAccept="image/*",imgMax=4e6,imgCnt=1,PB=null,AP=[],SM={},REC=null,SP=null,AIWHY="",TXQ={q:"",f:"all",off:0,p:null},TT,DK=null,PR=false;
let DB=null,UID=null,LS={st:"",m:{}},SYT=null,SYNCING=false,DIRTY=false,ERRN=0,IMGC={},IMGS=new Set(),SYNC="local";
try{S=JSON.parse(localStorage.getItem("zk2"))}catch(e){}
function norm(){if(!S||!Array.isArray(S.env)){S=null;return}S.free=+S.free||0;S.pay=S.pay||[];S.debts=S.debts||[];S.tx=S.tx||[];S.rec=S.rec||[];S.prof=S.prof||{};S.income=+S.income||0;S.payDay=+S.payDay||1;
S.env.forEach((e,k)=>{e.carry=+e.carry||0;e.bud=+e.bud||0;if(e.roll===undefined)e.roll=true;if(e.h===undefined)e.h=H[k%12]})}
norm();
function cache(){try{localStorage.setItem("zk2",JSON.stringify(S));return true}catch(e){return false}}
function save(){const ok=cache();if(DB)schedSync();else if(!ok)toast("Depolama dolu. Eski fiş fotoğraflarını silin ya da Ayarlar'dan yedek alın.")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(TT);TT=setTimeout(()=>t.classList.add("hide"),Math.max(3200,m.length*70))}

// ---------- bulut eşitleme (Claude db, kullanıcıya özel) ----------
const ST=()=>DB.doc("data/users/"+UID+"/state");
const syncTxt=()=>({local:"📱 Yalnızca bu cihazda",wait:"⏳ Eşitleniyor…",ok:"☁️ Eşitlendi",err:"⚠️ Eşitlenemedi"})[SYNC];
function syncUI(s){SYNC=s;document.querySelectorAll(".sy").forEach(el=>el.textContent=syncTxt())}
function schedSync(){clearTimeout(SYT);syncUI("wait");SYT=setTimeout(doSync,700)}
function txMonths(){const m={};(S?S.tx:[]).forEach(t=>{const k=t.date.slice(0,7);(m[k]=m[k]||[]).push(t)});Object.values(m).forEach(a=>a.sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0));return m}
async function doSync(){SYT=null;if(!DB||!S)return;if(SYNCING){DIRTY=true;return}SYNCING=true;DIRTY=false;
try{const ref=ST();
for(const t of S.tx)if(t.img&&t.img.startsWith("data:")){await ref.collection("img").doc(t.id).set({d:t.img});IMGC[t.id]=t.img;IMGS.add(t.id);t.img="@"}
const {tx,...st}=S,sj=cj(st);if(sj!==LS.st){await ref.set(JSON.parse(sj));LS.st=sj}
const m=txMonths();for(const k of new Set([...Object.keys(m),...Object.keys(LS.m)])){const j=m[k]?cj(m[k]):null;if(j===(LS.m[k]??null))continue;const r=ref.collection("tx").doc(k);if(j===null){await r.delete();delete LS.m[k]}else{await r.set({items:JSON.parse(j)});LS.m[k]=j}}
const live=new Set(S.tx.filter(t=>t.img).map(t=>t.id));for(const id of [...IMGS])if(!live.has(id)){await ref.collection("img").doc(id).delete();IMGS.delete(id);delete IMGC[id]}
cache();ERRN=0;syncUI("ok")}
catch(e){syncUI("err");if(e&&e.code=="quota_exceeded")toast("Bulut kotası doldu. Eski fiş fotoğraflarını silmeyi dene.");else if(++ERRN<4&&!DIRTY)setTimeout(schedSync,5000*ERRN)}
finally{SYNCING=false;if(DIRTY)schedSync()}}
function onStateSnap(s){if(!s.exists||s.metadata.hasPendingWrites)return;const r=cj(s.data());if(r===LS.st)return;
let loc="";if(S){const {tx,...st}=S;loc=cj(st)}
if(!S||loc===LS.st){S={...JSON.parse(r),tx:S?S.tx:[]};norm();LS.st=r;afterRemote()}else LS.st=r}
function onTxSnap(q){if(q.metadata.hasPendingWrites||!S)return;let ch=false;const m=txMonths();
q.docChanges().forEach(c=>{const k=c.doc.id,r=c.type=="removed"?null:cj(c.doc.data().items||[]),b=LS.m[k]??null;if(r===b)return;const loc=m[k]?cj(m[k]):null;
if(loc===b){S.tx=S.tx.filter(t=>t.date.slice(0,7)!==k);if(r)S.tx.push(...JSON.parse(r));ch=true}
if(r===null)delete LS.m[k];else LS.m[k]=r});
if(ch){S.tx.forEach(t=>{if(t.img=="@")IMGS.add(t.id)});afterRemote()}}
function afterRemote(){cache();softRender()}
async function initSync(){try{if(!window.claude||typeof claude.use!="function")return;const [db,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!u)return;const id=await u.id();if(!id)return;
DB=db;UID=id;syncUI("wait");const ref=ST(),[s0,q0]=await Promise.all([ref.get(),ref.collection("tx").get()]);
if(s0.exists){const st=clone(s0.data()),tx=[];LS.st=cj(st);LS.m={};q0.docs.forEach(d=>{const it=clone(d.data().items||[]);LS.m[d.id]=cj(it);tx.push(...it)});
let first=true;try{first=localStorage.getItem("zk2u")!==UID}catch(e){}
const extra=first&&S?S.tx.filter(t=>!tx.some(x=>x.id==t.id)):[];
S={...st,tx:tx.concat(extra)};norm();S.tx.forEach(t=>{if(t.img=="@")IMGS.add(t.id)});
if(extra.length){toast(extra.length+" işlem bu cihazdan buluta eklendi.");schedSync()}else syncUI("ok")}
else if(S){await doSync()}else syncUI("ok");
try{localStorage.setItem("zk2u",UID)}catch(e){}cache();
ref.onSnapshot(onStateSnap,()=>syncUI("err"));ref.collection("tx").onSnapshot(onTxSnap,()=>syncUI("err"));
if(S){roll();recRun()}render(false)}catch(e){syncUI("err")}}
async function hydrate(){if(!DB)return;for(const el of document.querySelectorAll("img[data-lazy]")){const id=el.dataset.lazy;if(!IMGC[id]){try{const s=await ST().collection("img").doc(id).get();if(!s.exists)continue;IMGC[id]=s.data().d}catch(e){continue}}document.querySelectorAll(`img[data-lazy="${id}"]`).forEach(x=>{if(x.src!==IMGC[id])x.src=IMGC[id]})}}
const imgOf=t=>t.img=="@"?(IMGC[t.id]||""):t.img;

// ---------- dönem hesapları ----------
function per(n){const d=S.payDay,cl=(y,m)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));let s=cl(n.getFullYear(),n.getMonth());if(s>n)s=cl(n.getFullYear(),n.getMonth()-1);return{s,e:cl(s.getFullYear(),s.getMonth()+1)}}
const prev=p=>per(new Date(p.s.getTime()-864e5));
const plbl=p=>{const l=new Date(p.e.getTime()-864e5);return `${p.s.getDate()} ${M[p.s.getMonth()]} – ${l.getDate()} ${M[l.getMonth()]}`};
function stat(p,cut){const a=iso(p.s),b=cut||iso(p.e),tx=S.tx.filter(t=>t.date>=a&&t.date<b).sort((x,y)=>y.date.localeCompare(x.date)||(y.id>x.id?1:-1)),sp={};let ns=0,ex=0,out=0;
tx.forEach(t=>{if(t.type=="gelir"){ex+=t.amt;return}out+=t.amt;if(envOf(t.env))sp[t.env]=(sp[t.env]||0)+t.amt;else ns+=t.amt});return{tx,sp,ex,ns,out}}
function roll(){if(!S)return;const cur=iso(per(new Date()).s);if(!S.cs||S.cs>cur){S.cs=cur;save();return}if(S.cs==cur)return;
let g=0;while(S.cs<cur&&g++<60){const p=per(new Date(S.cs+"T12:00:00")),st=stat(p),alloc=S.env.reduce((x,v)=>x+v.bud,0);let f=S.income+st.ex+S.free-alloc-st.ns;
S.env.forEach(e=>{const t=e.carry+e.bud-(st.sp[e.id]||0);if(e.roll)e.carry=t;else{f+=t;e.carry=0}});S.free=f;S.cs=iso(p.e)}save()}
function recRun(){if(!S||!S.rec.length)return;const n=new Date(),cur=mk(n.getFullYear(),n.getMonth());let ch=0;
S.rec.forEach(r=>{let [y,m]=r.last.split("-").map(Number);m--;for(let g=0;g<12;g++){m++;if(m>11){m=0;y++}const k=mk(y,m);if(k>cur)break;const due=new Date(y,m,Math.min(r.day,new Date(y,m+1,0).getDate()));if(due>n)break;
const id="r_"+r.id+"_"+k;if(!S.tx.some(t=>t.id==id)){S.tx.push({id,type:r.type,env:r.type=="gider"?(r.env||null):null,amt:r.amt,date:iso(due),note:r.name,img:"",rec:r.id});ch++}r.last=k}});
if(ch){save();toast(ch+" düzenli ödeme otomatik eklendi.")}}
function calc(){const n=new Date();n.setHours(0,0,0,0);const p=per(n),{s,e}=p,st=stat(p),alloc=S.env.reduce((x,v)=>x+v.bud,0),envTot=S.env.reduce((x,v)=>x+v.bud+v.carry,0),envSp=S.env.reduce((x,v)=>x+(st.sp[v.id]||0),0),
td=Math.max(1,Math.round((e-s)/864e5)),el=Math.min(td,Math.round((n-s)/864e5)+1),proj=envSp/el*td;
return{s,e,n,p,tx:st.tx,sp:st.sp,ns:st.ns,ex:st.ex,out:st.out,pool:S.income+st.ex+S.free-st.ns,alloc,envTot,envSp,rem:envTot-envSp,td,el,avg:envSp/el,projRem:envTot-proj,left:Math.max(0,Math.round((e-n)/864e5)),prog:Math.min(1,Math.max(0,(n-s)/(e-s))),lbl:plbl(p),nx:`${e.getDate()} ${M[e.getMonth()]}`}}
const obl=()=>S.debts.reduce((x,d)=>x+(d.k=="kart"?+d.min||0:+d.monthly||0),0);
function upcoming(c){const out=[],n=c.n,add=(day,fn)=>{for(let i=0;i<2;i++){const y=n.getFullYear(),m=n.getMonth()+i,d=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));if(d>=n&&d<c.e)fn(d)}};
S.rec.filter(r=>r.type=="gider").forEach(r=>add(r.day,d=>{if(mk(d.getFullYear(),d.getMonth())>r.last)out.push({n:r.name,a:r.amt,d})}));
S.debts.forEach(x=>{if(!x.day)return;const a=x.k=="kart"?+x.min||0:+x.monthly||0;if(a>0)add(x.day,d=>out.push({n:x.name+(x.k=="kart"?" (asgari)":" (taksit)"),a,d}))});
return out.sort((a,b)=>a.d-b.d)}
function payoff(d){if(!(d.bal>0)||!(d.min>0))return "";const r=(+d.faiz||0)/100;let b=d.bal,m=0,i=0;
while(b>0.5&&m<600){const it=b*r;if(d.min<=it)return "⚠️ Asgari ödeme faizi bile karşılamıyor; bu borç bu hızla hiç bitmez.";i+=it;b=b+it-d.min;m++}
return m>=600?"⚠️ Bu hızla 50 yıldan uzun sürer.":`Yalnız asgari ödenirse ~${m} ayda biter${r?`, faize ~${tl(i)} gider`:" (faiz oranını girersen maliyeti hesaplarım)"}.`}

// ---------- görünümler ----------

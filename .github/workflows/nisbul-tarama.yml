name: Nişbul günlük tarama

on:
  schedule:
    - cron: "17 3,15 * * *" # her gün 06:17 ve 18:17 (Türkiye saati)
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük yeni alan adı listesi taransın"
        default: "3"
      limit:
        description: "Bu çalışmada en çok kaç mağaza taransın"
        default: "4000"

concurrency:
  group: nisbul-tarama
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # zamanlamayı canlı tutmak için (aşağıdaki son adım)

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GUN: ${{ inputs.gun || '3' }}
      LIMIT: ${{ inputs.limit || '4000' }}
      PYTHONUNBUFFERED: "1" # ilerleme satırları kayıtta anında görünsün
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Görsel kütüphanesini kur
        run: pip install --quiet pillow==11.0.0
      - name: Yeni açılan Shopify mağazalarını keşfet
        run: python3 nisbul/araclar/kesif.py --gun "$GUN"
      - name: Mağazaların ürünlerini ve satış sıralarını tara
        if: always()
        run: python3 nisbul/araclar/tara.py --limit "$LIMIT" --sure 230
      - name: Görselleri eşleştir ve trendleri hesapla
        if: always()
        run: python3 nisbul/araclar/gorsel.py --limit 30000 --sure 50
      # GitHub, 60 gün commit gelmeyen herkese açık depolarda zamanlanmış işleri durdurur.
      # Her çalışmada işi yeniden etkinleştirmek bu sayacı sıfırlar; sistem kendi kendine çalışmaya devam eder.
      - name: Zamanlamayı canlı tut
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nisbul-tarama.yml/enable"

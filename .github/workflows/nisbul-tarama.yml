name: Nişbul günlük tarama

on:
  schedule:
    - cron: "17 3 * * *" # her gün 06:17 (Türkiye saati)
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük yeni alan adı listesi taransın"
        default: "3"
      limit:
        description: "Bu çalışmada en çok kaç mağaza taransın"
        default: "4000"

concurrency:
  group: nisbul-tarama
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GUN: ${{ inputs.gun || '3' }}
      LIMIT: ${{ inputs.limit || '4000' }}
      PYTHONUNBUFFERED: "1" # ilerleme satırları kayıtta anında görünsün
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yeni açılan Shopify mağazalarını keşfet
        run: python3 nisbul/araclar/kesif.py --gun "$GUN"
      - name: Mağazaların ürünlerini tara
        if: always()
        run: python3 nisbul/araclar/tara.py --limit "$LIMIT" --sure 240

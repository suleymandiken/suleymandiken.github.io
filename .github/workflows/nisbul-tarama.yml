name: Nişbul günlük tarama

on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # keşif + tarama: 06:17, 12:17, 18:17, 00:17 (Türkiye saati)
    - cron: "17 * * * *" # diğer saatlerde sadece tarama (ürün ve satış sırası güncellemesi)
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük whoisds listesi taransın"
        default: "3"
      limit:
        description: "Her tarama parçası en çok kaç mağaza tarasın (4 parça)"
        default: "2500"

concurrency:
  group: nisbul-tarama
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # önbellek temizliği ve zamanlamayı canlı tutmak için

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  PYTHONUNBUFFERED: "1"
  # Kod gizli (Supabase Storage nisbul-kod kutusu, kaynak: suleymandiken/nisbul). Depo herkese açık olduğu için
  # kayıtlar da herkese açıktır: çıktı dosyaya yazılır, sadece hata olursa son satırlar görünür.

jobs:
  # 1) Yeni kaydedilen alan adlarından Shopify'a bağlananları bul.
  # Saatlik çalışmalarda keşif atlanır: alan adı listeleri günde birkaç kez güncellenir, CZDS sık indirmeyi kısıtlar.
  kesif:
    if: github.event_name != 'schedule' || github.event.schedule == '17 3,9,15,21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GUN: ${{ inputs.gun || '3' }}
      # ICANN CZDS hesabı (czds.icann.org). Tanımlı değilse keşif sadece whoisds örneğiyle çalışır.
      CZDS_KULLANICI: ${{ secrets.CZDS_KULLANICI }}
      CZDS_SIFRE: ${{ secrets.CZDS_SIFRE }}
      CZDS_TLDLER: ${{ vars.CZDS_TLDLER }}
    steps:
      - name: Kodu gizli depodan indir
        run: |
          H=(-H "apikey: $SUPABASE_SERVICE_KEY")
          case "$SUPABASE_SERVICE_KEY" in sb_*) ;; *) H+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          curl -sf "${SUPABASE_URL%/}/storage/v1/object/nisbul-kod/nisbul-tarayici.tar.gz" "${H[@]}" -o k.tgz
          tar -xzf k.tgz && rm k.tgz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # .com bölge dosyası ~160 milyon alan adı: sıralama için disk açılır (kullanılmayan SDK'lar silinir).
      - name: Disk aç
        if: env.CZDS_KULLANICI != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      # Dünkü alan adı listesi önbellekte durur; bugünküyle karşılaştırılıp yeni kayıtlar bulunur.
      - name: Dünkü bölge listelerini geri yükle
        if: env.CZDS_KULLANICI != ''
        uses: actions/cache/restore@v4
        with:
          path: .czds
          key: czds-${{ github.run_id }}
          restore-keys: czds-
      - name: Yeni açılan Shopify mağazalarını keşfet
        run: python3 nisbul/araclar/kesif.py --gun "$GUN" --czds-klasor .czds > cikti.log 2>&1 || { tail -n 15 cikti.log; exit 1; }
      - name: Bugünkü bölge listelerini sakla
        if: always() && hashFiles('.czds/guncellendi') != ''
        uses: actions/cache/save@v4
        with:
          path: .czds
          key: czds-${{ github.run_id }}
      # Her gün yeni bir önbellek kaydı oluşur; depolama dolmasın diye sadece en yenisi tutulur.
      - name: Eski bölge önbelleklerini sil
        if: always() && hashFiles('.czds/guncellendi') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --key czds- --sort created_at --order desc --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete -R "${{ github.repository }}"

  # 2) Mağazaları tara. Ürün tavanı 340 bin: Supabase ücretsiz paketi 0,5 GB; tavan aşılınca en eski mağazaların ürünleri silinir.
  # (önceki satır) Mağazaları tara. Shopify istekleri IP başına kıstığı için iş 4 ayrı sunucuya (4 farklı IP) bölünür.
  tara:
    needs: kesif
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 250
    strategy:
      fail-fast: false
      matrix:
        parca: [0, 1, 2, 3]
    env:
      LIMIT: ${{ inputs.limit || '2500' }}
    steps:
      - name: Kodu gizli depodan indir
        run: |
          H=(-H "apikey: $SUPABASE_SERVICE_KEY")
          case "$SUPABASE_SERVICE_KEY" in sb_*) ;; *) H+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          curl -sf "${SUPABASE_URL%/}/storage/v1/object/nisbul-kod/nisbul-tarayici.tar.gz" "${H[@]}" -o k.tgz
          tar -xzf k.tgz && rm k.tgz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mağazaların ürünlerini ve satış sıralarını tara (parça ${{ matrix.parca }}/4)
        run: python3 nisbul/araclar/tara.py --limit "$LIMIT" --en-cok-urun 340000 --sure 230 --is 10 --parca ${{ matrix.parca }} --parca-sayisi 4 > cikti.log 2>&1 || { tail -n 15 cikti.log; exit 1; }

  # 3) Görsel eşleştirme, trendler ve site özeti.
  gorsel:
    needs: tara
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kodu gizli depodan indir
        run: |
          H=(-H "apikey: $SUPABASE_SERVICE_KEY")
          case "$SUPABASE_SERVICE_KEY" in sb_*) ;; *) H+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          curl -sf "${SUPABASE_URL%/}/storage/v1/object/nisbul-kod/nisbul-tarayici.tar.gz" "${H[@]}" -o k.tgz
          tar -xzf k.tgz && rm k.tgz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Görsel kütüphanesini kur
        run: pip install --quiet pillow==11.0.0
      - name: Görselleri eşleştir ve trendleri hesapla
        run: python3 nisbul/araclar/gorsel.py --limit 30000 --sure 50 > cikti.log 2>&1 || { tail -n 15 cikti.log; exit 1; }
      # GitHub, 60 gün commit gelmeyen herkese açık depolarda zamanlanmış işleri durdurur.
      # Her çalışmada işi yeniden etkinleştirmek bu sayacı sıfırlar; sistem kendi kendine çalışmaya devam eder.
      - name: Zamanlamayı canlı tut
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nisbul-tarama.yml/enable"

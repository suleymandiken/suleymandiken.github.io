name: GridPost Mini .exe

on:
  push:
    paths:
      - "gridpost/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install pillow pyinstaller
      - name: Tek dosya .exe derle
        working-directory: gridpost
        run: pyinstaller --onefile --windowed --name GridPostMini gridpost.py
      - name: Zip'le
        working-directory: gridpost
        run: Compress-Archive -Path dist/GridPostMini.exe, README.md -DestinationPath GridPostMini-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GridPostMini-windows
          path: gridpost/GridPostMini-windows.zip
      - name: Release'e yükle (sabit indirme linki)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gridpost
        run: |
          gh release view gridpost --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create gridpost --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "GridPost Mini (Windows)" --notes "GridPostMini-windows.zip dosyasını indir, aç, GridPostMini.exe'yi çalıştır."
          }
          gh release upload gridpost GridPostMini-windows.zip --clobber --repo "${{ github.repository }}"

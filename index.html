<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Süleyman Diken · Projeler</title>
<meta name="description" content="Süleyman Diken'in yaptığı ücretsiz, kayıt istemeyen küçük araçlar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232b4bd8'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ESD%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f1;--ink:#15211c;--mu:#5d6b64;--line:#d6ddd6;--ac:#2b4bd8;--tile:#e4e9e3;
--f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--ink:#e9efe9;--mu:#93a198;--line:#26302a;--ac:#8ea2ff;--tile:#1b221e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 22px max(40px,env(safe-area-inset-bottom))}
h1{font-size:clamp(64px,17vw,168px);line-height:.86;letter-spacing:-.055em;font-weight:800;margin:0 0 28px;font-variation-settings:"opsz" 96}
h1 span{display:block}
.intro{font-size:20px;max-width:34ch;color:var(--mu);margin:0 0 64px}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:0 0 6px;letter-spacing:0}
.list{border-top:2px solid var(--ink)}
a.p{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
a.p:hover .open,a.p:focus-visible .open{background:var(--ac);color:var(--bg);border-color:var(--ac)}
a.p:focus-visible{outline:3px solid var(--ac);outline-offset:4px;border-radius:6px}
.ic{width:64px;height:64px;border-radius:18px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:32px}
.nm{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ds{color:var(--mu);margin-top:2px;max-width:52ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mu)}
.open{font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.soon{padding:22px 4px;color:var(--mu);border-bottom:1px solid var(--line)}
footer{margin-top:56px;color:var(--mu);font-size:14px}
@media (max-width:560px){a.p{grid-template-columns:52px 1fr;gap:14px}.ic{width:52px;height:52px;font-size:26px;border-radius:15px}.open{grid-column:2;justify-self:start;margin-top:4px}.nm{font-size:21px}.intro{font-size:18px;margin-bottom:48px}}
</style></head><body><main class="wrap">
<h1><span>Süleyman</span><span>Diken</span></h1>
<p class="intro">Kendi günlük sorunlarım için yaptığım küçük araçlar. Hepsi ücretsiz, kayıt istemez ve verilerin kendi cihazında kalır.</p>
<h2 id="count"></h2>
<div class="list" id="list"></div>
<footer>© <span id="yr"></span> Süleyman Diken</footer>
</main>
<script>
/* YENİ PROJE EKLEMEK İÇİN:
   1) Projenin dosyasını yeni bir klasöre "index.html" adıyla koy (örn: hesaplayici/index.html)
   2) Aşağıdaki listeye bir satır ekle. "adres" klasör adıyla aynı olmalı. */
const PROJELER=[
 {adres:"gelirgider",emoji:"✉️",ad:"Zarfım",aciklama:"Maaşını zarflara ayır, harcamalarını, kart borçlarını ve taksitlerini takip et. Telefonuna uygulama gibi kurulur.",etiketler:["Bütçe","Borç takibi","Çevrimdışı çalışır"]},
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("count").textContent=PROJELER.length+" proje";
document.getElementById("list").innerHTML=PROJELER.map(p=>`<a class="p" href="${esc(p.adres)}/"><span class="ic" aria-hidden="true">${esc(p.emoji)}</span><span><span class="nm">${esc(p.ad)}</span><span class="ds" style="display:block">${esc(p.aciklama)}</span><span class="tags">${(p.etiketler||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</span></span><span class="open">Aç</span></a>`).join("")+`<div class="soon">Yeni projeler yolda.</div>`;
document.getElementById("yr").textContent=new Date().getFullYear();
</script></body></html>
